# ── 许可证核实（2026-10-18）──
# 结论：上游**未声明**许可证 —— 这是"查到了没有"，不是"没查到"。
# 证据：GitHub API license=null；仓库根目录仅 .gitignore / README.mkd / go.mod / main.go / script/，
#       无 LICENSE/COPYING；main.go 头部无版权或许可声明。
# 含义：无许可证默认保留全部权利，再分发/打包需谨慎；故 license 仍留 unknown（不臆测为 MIT）。
name: "waybackurls"
command: "waybackurls"
enabled: true
version: "1.0.0"
source: "upstream"
upstream: "https://github.com/tomnomnom/waybackurls"
license: "unknown"
trust: "builtin"
short_description: "从Wayback Machine获取历史URL"
description: |
  Waybackurls从Wayback Machine获取目标域名的历史URL。

  **主要功能：**
  - 历史URL发现
  - 版本获取
  - 子域名支持

  **使用场景：**
  - 历史URL收集
  - Bug bounty侦察
  - 安全测试
  - 内容发现
parameters:
  - name: "domain"
    type: "string"
    description: "目标域名"
    required: true
    position: 0
    format: "positional"
  - name: "get_versions"
    type: "bool"
    description: "获取所有版本的URL"
    required: false
    flag: "-get-versions"
    format: "flag"
    default: false
  - name: "no_subs"
    type: "bool"
    description: "不包含子域名"
    required: false
    flag: "-no-subs"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
      额外的waybackurls参数。用于传递未在参数列表中定义的waybackurls选项。

      **注意事项：**
      - 多个参数用空格分隔
      - 确保参数格式正确，避免命令注入
      - 此参数会直接追加到命令末尾
    required: false
    format: "positional"
