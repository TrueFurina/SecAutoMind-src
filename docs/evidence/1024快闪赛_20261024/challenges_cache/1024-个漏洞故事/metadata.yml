description: '情报组归档了 **1024 条**脱敏漏洞故事（`stories.json`），组长离职前留下一页《交接守则》（`BRIEF.md`）。


  守则说：暗号被拆成 **6 片**藏在故事里——但全部 1024 条都带着 `[方括号]` 样式的归档记号，绝大多数是诱饵。真正的 6 片挂在一条"同源链"上：每条链上故事的正文都指明了它与「**某行业、某年**」的另一起事件同源，而这个"行业
  + 年份"组合在整个档案里**只会命中一条**。


  从守则指定的起点出发，把 6 片按链条顺序拼回来，套上 `DASCTF{}` 提交。


  ## 提示


  - 规则全文见附件 `BRIEF.md`（怎么走链、怎么拼，都写清楚了）；

  - 数据是结构化 JSON，jq / Python / 甚至编辑器全局搜索都能做；

  - 拼接不加任何分隔符；flag 区分大小写。


  > 本题附件**按选手单独生成**：打开题目后平台自动生成，状态变为「已完成」后下载（`tar.gz` 压缩包，解压即得上述文件）。每人附件和 flag 都不同，抄别人的答案无效。


  > flag 格式：`DASCTF{...}`，区分大小写，提交时前后不要带空格。'
