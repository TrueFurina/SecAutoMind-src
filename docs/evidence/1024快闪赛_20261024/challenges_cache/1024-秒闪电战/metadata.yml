name: 1024 秒闪电战
category: Misc
description: '**⚡ 本题只在闪电窗口内开放：19:10:24–19:27:28（持续 1024 秒）。窗口内得分翻倍——这是全场唯一的倍率时刻。**


  附件是一台"闪电引擎"：只有 6 条指令的栈式小机器（`run.py`，60 行，读得懂），和一条正好 **1024 条指令**的纸带 `tape.txt`。


  引擎出厂只带一半能量（512 点，每执行一条指令消耗 1 点），跑到一半就会趴窝。把能量补满，它会吐出一句话——那句话里就有 flag。


  本地运行（Python 3.8+，无第三方依赖）：


  ```

  python3 run.py tape.txt                # 半能量：只能拿到前半句

  python3 run.py tape.txt --energy 1024  # 满能量

  ```


  flag 区分大小写。祝你在 1024 秒里手比闪电快。


  > 本题附件**按选手单独生成**：打开题目后平台自动生成，状态变为「已完成」后下载（`tar.gz` 压缩包，解压即得上述文件）。每人附件和 flag 都不同，抄别人的答案无效。


  > flag 格式：`DASCTF{...}`，区分大小写，提交时前后不要带空格。'
