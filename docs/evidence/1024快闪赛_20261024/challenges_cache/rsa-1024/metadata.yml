name: RSA-1024
category: Crypto
description: '运维同学从一台退役加密机上翻出了一份还在运行的加密脚本和它的一组输出，说是那天晚上熵源坏了才换的机器。


  附件：


  - `task.py`：泄露的加密脚本（原件，secret 部分当时就被删了）；

  - `output.txt`：脚本的一次真实输出（`n`、`e`、`c`）。


  flag 就是被这组参数加密的明文（`FLAG` 右侧用 `.` 补齐到 127 字节后加密）。


  把明文还原出来，flag 区分大小写。


  ## 提示


  - `e = 1024`，不是常见的 65537——想想它意味着什么；

  - 脚本注释没有撒谎：那晚出生的两个素数确实挨得很近。


  > 本题附件**按选手单独生成**：打开题目后平台自动生成，状态变为「已完成」后下载（`tar.gz` 压缩包，解压即得上述文件）。每人附件和 flag 都不同，抄别人的答案无效。


  > flag 格式：`DASCTF{...}`，区分大小写，提交时前后不要带空格。'
