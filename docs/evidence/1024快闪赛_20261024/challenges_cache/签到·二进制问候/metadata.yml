name: 签到·二进制问候
category: Misc
description: '计算机的世界只有 0 和 1。今天，它们凑够了 1024 个，想跟你说句话。


  附件 `greeting.txt` 里是 1024 个 0/1 字符，按 8 位一组、空格分隔（正好 128 组）。


  把这 128 组二进制每组转成 1 个 ASCII 字符，得到一段 128 字节的文本——**flag 就是这段文本开头的 `DASCTF{...}`**（后面的内容只是欢迎语，不用管）。


  flag 区分大小写，前后不要带空格。


  > flag 格式：`DASCTF{...}`，区分大小写，提交时前后不要带空格。'
