name: release

# 三平台原生编译（mattn/go-sqlite3 需 cgo，各平台用自身原生编译器，杜绝交叉编译损坏）
# 触发：推送 v* 标签 → 三平台产物自动上传到对应 Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (e.g. v1.7.21)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Install sqlite build deps
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev gcc
      - name: Build linux amd64
        run: CGO_ENABLED=1 go build -trimpath -o secautomind-ai-linux-amd64 ./cmd/server
      - name: Smoke test
        run: |
          timeout 20 ./secautomind-ai-linux-amd64 --http & sleep 6
          curl -fsS -o /dev/null -w "GET / -> %{http_code}\n" http://127.0.0.1:8080/ || true
          pkill -f secautomind-ai-linux-amd64 || true
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${TAG_NAME}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          gh release upload "$tag" secautomind-ai-linux-amd64 --repo "${GITHUB_REPOSITORY}" --clobber || \
            gh release create "$tag" secautomind-ai-linux-amd64 --repo "${GITHUB_REPOSITORY}" --title "SecAutoMind $tag" --notes "CI build"

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build macOS ${{ matrix.arch }}
        run: |
          GOARCH=${{ matrix.arch }} CGO_ENABLED=1 go build -trimpath -o secautomind-ai-macos-${{ matrix.arch }} ./cmd/server
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${TAG_NAME}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          gh release upload "$tag" secautomind-ai-macos-${{ matrix.arch }} --repo "${GITHUB_REPOSITORY}" --clobber || \
            gh release create "$tag" secautomind-ai-macos-${{ matrix.arch }} --repo "${GITHUB_REPOSITORY}" --title "SecAutoMind $tag" --notes "CI build"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Install mingw (cgo for go-sqlite3)
        run: choco install mingw -y --no-progress
        shell: bash
      - name: Generate icon resource
        run: |
          go install github.com/akavel/rsrc@latest
          "/c/Users/runneradmin/go/bin/rsrc.exe" -ico assets/secautomind.ico -o cmd/server/resource_windows.syso || \
            rsrc -ico assets/secautomind.ico -o cmd/server/resource_windows.syso
        shell: bash
      - name: Build windows GUI exe
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:/c/msys64/mingw64/bin:$PATH"
          export CC="x86_64-w64-mingw32-gcc"
          CGO_ENABLED=1 go build -trimpath -ldflags "-H windowsgui" -o secautomind-ai.exe ./cmd/server
        shell: bash
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${TAG_NAME}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          gh release upload "$tag" secautomind-ai.exe --repo "${GITHUB_REPOSITORY}" --clobber || \
            gh release create "$tag" secautomind-ai.exe --repo "${GITHUB_REPOSITORY}" --title "SecAutoMind $tag" --notes "CI build"
