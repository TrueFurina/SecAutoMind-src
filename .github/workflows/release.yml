name: release

# 三平台原生编译（SQLite 驱动为纯 Go glebarez，CGO_ENABLED=0 即可，无需系统 sqlite 库与 cgo 工具链）
# 触发：推送 v* 标签 → 三平台产物自动上传到对应 Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (e.g. v1.7.21)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # 测试门禁：vet + 全量测试 + 竞态检测（-race 运行时需 gcc，与 sqlite 驱动无关）
  # ⚠️ 必须与 ci.yml 的 test job 保持同构：先 regen 嵌套 .git 夹具 + golden 冻结校验，
  #    再跑 -race 全测。缺 regen_exec_fixtures 会导致 TestExecSolversAgainstBenchmark
  #    因缺 git 历史失败（本仓 09-30 v1.7.28 release run 36711273812 即栽在这）。
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure gcc for -race (runner image ships one; install only if missing)
        run: |
          if command -v gcc >/dev/null 2>&1; then
            echo "gcc already present: $(gcc --version | head -1)"
          else
            sudo apt-get update && sudo apt-get install -y gcc
          fi
      - name: Regenerate execution fixtures (nested .git repos not committed by design)
        run: python data/ctf_benchmark/regen_exec_fixtures.py
      - name: Cross-language golden freeze check (blocks hand-edited golden)
        run: python scripts/check_golden_freeze.py
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./... -timeout 900s

  # 打包前密钥门禁（P0）：所有 build job 的前置。
  # 为什么必须有：交付包会带上被 .gitignore 排除、但仍躺在磁盘上的 config.yaml，
  # 里面可能含真实 API key。仓库干净 ≠ 交付包干净 —— 门禁必须扫**磁盘真实文件**。
  # 旧流程缺失此步，等于那把锁没装在门上。
  secret-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret guard (form-pattern only in CI; real fingerprint check is enforced locally)
        run: python scripts/secret_guard.py --allow-no-fingerprint

  # 先建 Release（幂等）：三平台 build job 并行，若各自都 `gh release create` 会因
  # "release already exists" 互相踩死（tag 推送不自动建 Release）。统一由本 job 串行建好，
  # build job 只负责 upload，消除竞态。
  create-release:
    needs: [test-linux, secret-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "${GITHUB_REPOSITORY}" --title "SecAutoMind $tag" --notes "CI automated build"

  build-linux:
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build linux amd64
        run: CGO_ENABLED=0 go build -trimpath -o secautomind-ai-linux-amd64 ./cmd/server
      - name: Smoke test
        run: |
          timeout 20 ./secautomind-ai-linux-amd64 --http & sleep 6
          curl -fsS -o /dev/null -w "GET / -> %{http_code}\n" http://127.0.0.1:18086/ || true
          pkill -f secautomind-ai-linux-amd64 || true
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${TAG_NAME}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          gh release upload "$tag" secautomind-ai-linux-amd64 --repo "${GITHUB_REPOSITORY}" --clobber || \
            gh release create "$tag" secautomind-ai-linux-amd64 --repo "${GITHUB_REPOSITORY}" --title "SecAutoMind $tag" --notes "CI build"

  build-macos:
    needs: [create-release]
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build macOS ${{ matrix.arch }}
        run: |
          GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath -o secautomind-ai-macos-${{ matrix.arch }} ./cmd/server
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${TAG_NAME}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          gh release upload "$tag" secautomind-ai-macos-${{ matrix.arch }} --repo "${GITHUB_REPOSITORY}" --clobber || \
            gh release create "$tag" secautomind-ai-macos-${{ matrix.arch }} --repo "${GITHUB_REPOSITORY}" --title "SecAutoMind $tag" --notes "CI build"

  build-windows:
    needs: [create-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Generate icon resource
        run: |
          go install github.com/akavel/rsrc@latest
          "/c/Users/runneradmin/go/bin/rsrc.exe" -ico assets/secautomind.ico -o cmd/server/resource_windows.syso || \
            rsrc -ico assets/secautomind.ico -o cmd/server/resource_windows.syso
        shell: bash
      - name: Build windows GUI exe
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -w -s" -o secautomind-ai.exe ./cmd/server
        shell: bash
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${TAG_NAME}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          gh release upload "$tag" secautomind-ai.exe --repo "${GITHUB_REPOSITORY}" --clobber || \
            gh release create "$tag" secautomind-ai.exe --repo "${GITHUB_REPOSITORY}" --title "SecAutoMind $tag" --notes "CI build"
