name: release

# 三平台原生编译（SQLite 驱动为纯 Go glebarez，CGO_ENABLED=0 即可，无需系统 sqlite 库与 cgo 工具链）
# 触发：推送 v* 标签 → 三平台产物自动上传到对应 Release
#       workflow_dispatch + inputs.tag → 手动对指定既有 tag 出包
# ⚠️ tag 目标单一真值源（2026-10-24 修复）：此前 inputs.tag 声明了却从未被读取
#    （建 Release 用 GITHUB_REF_NAME、上传引用从未赋值的 TAG_NAME），且各 job 检出
#    的是触发 ref 而非发布 tag —— 手动填 tag 既不决定发布目标，也不决定构建来源。
#    现在：create-release 里的 resolve 步骤统一解析+校验（fail-closed：tag 必须已存在，
#    否则 gh 会在默认分支 HEAD 上凭空建 tag，产物与发布目标错位），经 job outputs
#    下发到所有 build job；**所有 job 的 checkout 都绑定该 tag**，保证构建来源 = 发布目标。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (e.g. v1.7.21，必须是已存在的 v* tag)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # 测试门禁：vet + 全量测试 + 竞态检测（-race 运行时需 gcc，与 sqlite 驱动无关）
  # ⚠️ 必须与 ci.yml 的 test job 保持同构：先 regen 嵌套 .git 夹具 + golden 冻结校验，
  #    再跑 -race 全测。缺 regen_exec_fixtures 会导致 TestExecSolversAgainstBenchmark
  #    因缺 git 历史失败（本仓 09-30 v1.7.28 release run 36711273812 即栽在这）。
  test-linux:
    runs-on: ubuntu-latest
    steps:
      # 手动 dispatch 指定 tag 时，测试也必须跑在该 tag 的源码上（而非当前分支）
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure gcc for -race (runner image ships one; install only if missing)
        run: |
          if command -v gcc >/dev/null 2>&1; then
            echo "gcc already present: $(gcc --version | head -1)"
          else
            sudo apt-get update && sudo apt-get install -y gcc
          fi
      - name: Regenerate execution fixtures (nested .git repos not committed by design)
        run: python data/ctf_benchmark/regen_exec_fixtures.py
      - name: Cross-language golden freeze check (blocks hand-edited golden)
        run: python scripts/check_golden_freeze.py
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./... -timeout 900s

  # 打包前密钥门禁（P0）：所有 build job 的前置。
  # 为什么必须有：交付包会带上被 .gitignore 排除、但仍躺在磁盘上的 config.yaml，
  # 里面可能含真实 API key。仓库干净 ≠ 交付包干净 —— 门禁必须扫**磁盘真实文件**。
  # 旧流程缺失此步，等于那把锁没装在门上。
  secret-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret guard (form-pattern only in CI; real fingerprint check is enforced locally)
        run: python scripts/secret_guard.py --allow-no-fingerprint

  # 先建 Release（幂等）：三平台 build job 并行，若各自都 `gh release create` 会因
  # "release already exists" 互相踩死（tag 推送不自动建 Release）。统一由本 job 串行建好，
  # build job 只负责 upload，消除竞态。
  create-release:
    needs: [test-linux, secret-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Resolve target tag (single source of truth)
        id: resolve
        env:
          # 手工输入不得直接内插进 bash（表达式直插 run 脚本是注入向量），经 env 间接传递
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            case "$tag" in
              v*) ;;
              *) echo "::error::tag 输入必须以 v 开头（当前：$tag）"; exit 1 ;;
            esac
            # fail-closed：目标 tag 必须已存在。否则 gh release create 会在默认分支
            # HEAD 上凭空建同名 tag → 发布目标与各 job 检出的源码错位。
            if ! git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
              echo "::error::refs/tags/$tag 在远端不存在 —— 先打 tag 再来发版"; exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "resolved release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "${GITHUB_REPOSITORY}" --title "SecAutoMind $tag" --notes "CI automated build"

  build-linux:
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      # 检出 = 发布目标 tag（经 create-release 解析，单一真值源）
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build linux amd64
        run: CGO_ENABLED=0 go build -trimpath -o secautomind-ai-linux-amd64 ./cmd/server
      - name: Smoke test (binary must boot and serve HTTP)
        # ⚠️ 修复记录（2026-10-13）：旧版唯一断言是 `curl ... || true`，
        #    而 `|| true` 使本步**永远为绿** —— 二进制启动即崩、18086 根本没监听，
        #    也照样通过并发布（哑门禁：有门禁之名、无门禁之实）。
        #    现改为轮询等待端口就绪；"进程活着但服务没起来 / 返回 5xx" 一律 FAIL。
        #    判定取"能拿到 HTTP 响应且非 5xx"，不锁定具体状态码（避免 302/401 误红）。
        run: |
          timeout 30 ./secautomind-ai-linux-amd64 --http & pid=$!
          sleep 6
          code=""
          for _ in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:18086/ 2>/dev/null || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then break; fi
            sleep 2
          done
          kill "$pid" 2>/dev/null || true
          pkill -f secautomind-ai-linux-amd64 2>/dev/null || true
          echo "GET / -> ${code:-<none>}"
          case "$code" in
            5??) echo "::error::smoke FAILED：GET / 返回服务器错误 $code"; exit 1 ;;
            000|"") echo "::error::smoke FAILED：18086 无任何 HTTP 响应（二进制未起服务）"; exit 1 ;;
            *) echo "smoke OK: GET / -> $code" ;;
          esac
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          gh release upload "$tag" secautomind-ai-linux-amd64 --repo "${GITHUB_REPOSITORY}" --clobber || \
            gh release create "$tag" secautomind-ai-linux-amd64 --repo "${GITHUB_REPOSITORY}" --title "SecAutoMind $tag" --notes "CI build"

  build-macos:
    needs: [create-release]
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      # 检出 = 发布目标 tag（经 create-release 解析，单一真值源）
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build macOS ${{ matrix.arch }}
        run: |
          GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath -o secautomind-ai-macos-${{ matrix.arch }} ./cmd/server
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          gh release upload "$tag" secautomind-ai-macos-${{ matrix.arch }} --repo "${GITHUB_REPOSITORY}" --clobber || \
            gh release create "$tag" secautomind-ai-macos-${{ matrix.arch }} --repo "${GITHUB_REPOSITORY}" --title "SecAutoMind $tag" --notes "CI build"

  build-windows:
    needs: [create-release]
    runs-on: windows-latest
    steps:
      # 检出 = 发布目标 tag（经 create-release 解析，单一真值源）
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Generate icon resource (best-effort; build still works without it)
        continue-on-error: true
        shell: bash
        run: |
          go install github.com/akavel/rsrc@latest 2>/dev/null || true
          "$(go env GOPATH)/bin/rsrc.exe" -ico assets/secautomind.ico -o cmd/server/resource_windows.syso 2>/dev/null || \
            rsrc -ico assets/secautomind.ico -o cmd/server/resource_windows.syso 2>/dev/null || true
      - name: Build windows GUI exe
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -w -s" -o secautomind-ai.exe ./cmd/server
        shell: bash
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ needs.create-release.outputs.tag }}"
          gh release upload "$tag" secautomind-ai.exe --repo "${GITHUB_REPOSITORY}" --clobber || \
            gh release create "$tag" secautomind-ai.exe --repo "${GITHUB_REPOSITORY}" --title "SecAutoMind $tag" --notes "CI build"
