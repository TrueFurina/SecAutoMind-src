name: ci

# PR 门禁：每次 PR / push 到 main 自动跑 vet + 测试 + race 检测
# 对齐 release.yml 的 test-linux 逻辑，但触发范围更广、响应更快
#
# 缓存纪律（REA #142，2026-10-20 核对）：本文件**不使用** actions/cache 或
# setup-* 的 cache: 选项。匿名门禁 / 密钥扫描 / 证据哈希这类门禁的输入是
# 「当前工作树的字节」，缓存它们的中间产物（依赖安装、检查结果、生成报告）
# 等于让门禁看旧世界——缓存命中时它们会基于过期内容放行。若要加缓存，
# 只允许缓存**与判定无关**的东西（如 Go module 下载），且必须与门禁步骤分离。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# 免费额度吃紧时的第一道止血：连推时取消同分支的旧 run。
# 本项目是"修完即推"的节奏（09-30 一次会话连推 8 次），若不取消，
# 8 个 run 会并行各烧一份额度，而单 run 里光 `-race ./...` 就要十几分钟。
# 被取消的 run 按已消耗的实际分钟计费，所以取消是净省。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 主干测试门禁：go vet + `go test -race` 全量 + 构建，并前置 golden 冻结校验、
  # 加密模板自测、HITL 边界检查 —— 它是唯一跑真实 Go 测试套件的 job，
  # 其余 job 只跑各自门禁的脚本。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # gcc 只是 `go test -race` 的 race 运行时（C 实现）所需；项目 SQLite 驱动是
      # 纯 Go 的 github.com/glebarez/go-sqlite，不需要 cgo、也不需要 libsqlite3-dev。
      # GitHub 的 ubuntu runner 镜像本身就带 gcc，无条件 apt-get 会白花 40-60 秒/次；
      # 改为「有则跳过、无则兜底安装」，既省时又不会在镜像变动时挂掉。
      - name: Ensure gcc for -race (runner image ships one; install only if missing)
        run: |
          if command -v gcc >/dev/null 2>&1; then
            echo "gcc already present: $(gcc --version | head -1)"
          else
            sudo apt-get update && sudo apt-get install -y gcc
          fi
      # 执行基准集两道 git 历史题（exec_git_repo / git_cred_repo）含嵌套 .git，
      # 依设计不入库（gen_exec_artifacts*.py 注释「嵌套 .git 不入库，由本脚本再生成」），
      # 必须先在本地重新生成，否则 TestExecSolversAgainstBenchmark 因缺 git 历史退化到 13/15。
      - name: Regenerate execution fixtures (nested .git repos not committed by design)
        run: python data/ctf_benchmark/regen_exec_fixtures.py
      # 跨语言 golden 的冻结校验：CI 无真源仓库（西湖论剑 ctf_agent），
      # 无法直接跑 gen_protocol_golden.py --check；这里用哈希冻结堵住"手改 golden 不重跑生成器"。
      # 真源↔golden 的一致性仍需本地 `gen_protocol_golden.py --check`（见脚本内提示）。
      - name: Golden freeze gate self-test (empty freeze file must NOT pass)
        run: python scripts/check_golden_freeze_test.py
      - name: Cross-language golden freeze check (blocks hand-edited golden)
        run: python scripts/check_golden_freeze.py
      # CTF 密码攻击模板库（scripts/ctf_sage/，计划 P0-2）：每个模板用合成参数造题→解题→断言，
      # 参数不满足前提时必须报 not_applicable 而非瞎跑。t4 Boneh-Durfee 依赖 sympy、
      # t1 根提取主路径 _roots_numpy 依赖 numpy（缺 numpy 时退化 _roots_float，只对
      # double 安全范围的系数有效——大格必 miss，PR #58 实测 2/6 假红）。
      # requirements.txt 是工具运行时依赖，不含它们，故此处局部安装。
      - name: Install crypto template deps (sympy for t4 Boneh-Durfee, numpy for t1 root extraction)
        run: python -m pip install sympy numpy
      - name: CTF crypto templates self-test (t1-t6)
        run: |
          set -e
          for f in t1_coppersmith t2_ecdsa_hnp t3_truncated_lfsr t4_boneh_durfee t5_dlp_bsgs_ph t6_hastad_broadcast; do
            echo "=== $f ==="
            python scripts/ctf_sage/$f.py --selftest
          done
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        # -skip：A→B 立尺的「有数据子集」测试（TestCrossBench_AttachmentSubset）本地实测
        # 29.6s~242s 大幅波动（presolve 扫描超时机制不定时触发），-race 下会顶穿本 job
        # 的 900s 总预算 → 移至独立 job cross-bench-subset 实跑（不跳过、不降级为不跑）。
        # 2026-10-17 同因追加 TestExternalBench_AttachmentSubset（外部尺附件子集实测
        # 65~67s，-race 下按 3~5x 计会吃掉 200~330s 预算）—— 同样**不在本 job 跑 ≠ 不跑**：
        # 它由 external-bench job 全量实跑（含文本口径 + 载荷台账 + 反注水钉子 + 门禁自测）。
        #
        # 2026-10-23 再追加 3 个「纯测量」基准（TestRealBenchmark_*）：它们只统计命中率，
        # **不测并发**，在 -race 下纯属 3~5x 浪费；其口径由 quant-gate job
        # （`check_quant_effect.py --full` 的 real_static_shipped / real_static_registry /
        # real_static_real_solver 三条陈述）在 CI 里逐条机验 —— 同样"不在本 job 跑 ≠ 不跑"。
        # 同时把总预算 900s → 1800s：本会话实测（128 核服务器）该命令已需 ~990s，
        # 900s 会红；新增的链式求解器/4 个 Go 基准镜像都增加了真实工作量。
        # 2026-10-24 追加 TestCrossBench_BinaryAttachmentSubset（二进制附件子集，
        # 纯测量 ~75-90s，同纪律移 cross-bench-subset job 实跑——不在本 job 跑 ≠ 不跑）。
        run: CGO_ENABLED=1 go test -race -count=1 ./... -timeout 1800s -skip 'TestCrossBench_AttachmentSubset|TestCrossBench_BinaryAttachmentSubset|TestExternalBench_AttachmentSubset|TestRealBenchmark_ShippedPresolve|TestRealBenchmark_RegistryPresolve|TestRealBenchmarkHitNotInflatedByPlaintextFlag'
      # 附件基准逐题诊断（常驻留痕，用于排查该测试在 CI 上的偶发 9/10）。
      # 必须单独 -v 跑：Go 测试框架会捕获测试进程的 stdout/stderr，
      # 全量跑（无 -v）时连 fmt.Printf 也不会出现在日志里（实测 0 次）。
      # ⚠️ 本步含管道 `... | tail -25`。GitHub 对未写 shell: 的 run 步用
      #    `bash -e {0}`（**不含** pipefail），管道退出码只取末位命令 tail →
      #    go test 失败会被吞成绿（哑门禁）。故显式 set -o pipefail。
      - name: Attachment benchmark diagnostics (verbose, for flaky triage)
        run: |
          set -o pipefail   # 没有它，管道左端的 go test 失败不会让本步变红
          CGO_ENABLED=1 go test -race -count=1 -v -run TestAttachmentForensicsBenchmark ./internal/ctfplatform/ 2>&1 | tail -25
      # 规划 §4.2：HITL 失效边界的**确定性**模式机验（超时挂死 / 落库失败 / 覆盖冲突 /
      # 越界裁决 / 参数篡改），主路径 + C2 桥接路径双跑。human 档（false-approve/block）
      # 需外部导师评测，脚本如实标 OPEN，**不伪造数据**；本步只判定 machine 档。
      # 门禁自身也要有回归测试（2026-10-14 门禁审计）：`go test` 在测试名对不上时
      # 照样 exit 0（no tests to run），旧判据把「一条都没跑」判成 PASS，
      # 模式矩阵全绿而验证覆盖为 0。现从 -v 输出回读每个测试名的判定行，缺一即红。
      - name: HITL boundary gate self-test (no-tests-to-run must NOT pass)
        run: python scripts/run_hitl_boundary_test.py
      - name: HITL failure-boundary check (deterministic modes)
        run: python scripts/run_hitl_boundary.py --check
      - name: Build
        run: CGO_ENABLED=1 go build -trimpath ./cmd/server

  # Go 全系静态检查门禁（2026-10-21 新增，通道见 E:\Program\实验服务器与全局配置.md §九）。
  # 首跑 156 条 → 修掉 21 条后基线 135 条。**只拦新增语义类告警**
  # （SA4xxx/SA5xxx/SA9xxx/ST1008），风格类与死代码只计量不阻断——
  # 首日就把门禁设成"零告警"，唯一的下场是被 --no-verify 绕过（REA #169）。
  # 报告上传为 artifact，红了可以直接下载定位。
  staticcheck-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      # 固定版本：staticcheck 的新版会新增检查项，不固定则基线无意义
      - name: Install staticcheck (pinned 2025.1.1)
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - name: Run staticcheck
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          staticcheck -version
          # staticcheck 有告警时退出码非 0；判定交给下面的基线守卫，这里只保证报告生成
          staticcheck -f json ./... > staticcheck.json || true
          echo "告警条数: $(grep -c . staticcheck.json || echo 0)"
      # 门禁自身要有"必须被抓到"的用例：永远绿的门禁比没有门禁更坏（REA #253）
      - name: Static gate self-test (bad sample must be red)
        run: python scripts/check_staticcheck_baseline_test.py
      # 死代码台账自测：门禁自身要有"必须被抓到"的用例（REA #253）
      - name: Dead code ledger self-test
        run: python scripts/dead_code_ledger_test.py
      # U1000 的守门人：基线里那条 file:"*" 已降级为说明性条目，
      # 真正的判定在这里——报告里每条 U1000 的 (文件::符号) 必须在台账里有裁定。
      - name: Dead code ledger gate (every U1000 must be ruled)
        run: python scripts/dead_code_ledger.py --report staticcheck.json --gate
      - name: Static gate vs baseline (new semantic findings block)
        run: python scripts/check_staticcheck_baseline.py --report staticcheck.json
      - name: Upload staticcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staticcheck-report
          path: staticcheck.json
          if-no-files-found: warn

  # 能力回归门禁：不依赖外部数据文件/在线靶场，纯 Go 内存级验证。
  # 防止「求解器注水 / 误报 / 注册表死代码」回归，每次 PR/push 自动拦。
  capability-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Ensure gcc for -race (runner image ships one; install only if missing)
        run: |
          if command -v gcc >/dev/null 2>&1; then
            echo "gcc already present: $(gcc --version | head -1)"
          else
            sudo apt-get update && sudo apt-get install -y gcc
          fi
      - name: Capability regression gate
        run: CGO_ENABLED=1 go test -race -count=1 ./internal/ctfplatform/ -run 'TestAllRegisteredSolversActuallyExecute|TestECDSANonceReuse|TestPaddingOracle|TestBlindOOB|TestHashLengthExtension|TestGCMNonceReuse|TestMT19937UntemperIsInverse|TestMT19937PredictNext|TestMT19937SolverParses|TestMT19937SolverRegistered|TestMT19937NoFalsePositive|TestMT19937InsufficientOutputs|TestMT19937RecoverSha256Consistency|TestLFSRBerlekampMasseyBasic|TestLFSRPredictDegree32|TestLFSRSolverParses|TestLFSRSolverRegistered|TestLFSRNoFalsePositive|TestLFSRShortLeakNoPredict|TestLCGAdvanceMatchesNaive|TestLCGRecoverAC|TestLCGRecoverModulus|TestLCGSolverParsesKnownParams|TestLCGSolverParsesRecoverAC|TestLCGSolverParsesRecoverModulus|TestLCGSolverRegistered|TestLCGNoFalsePositive|TestCRC32StdMatchesStdlib|TestCRC32ForgeProducesTarget|TestCRC32ForgeUniqueness|TestCRC32SolverParses|TestCRC32SolverRegistered|TestCRC32NoFalsePositive|TestForensicsNoFalsePositiveOnRandom|TestWebExploitNoFalsePositive|TestPresolveRegistrySweepNoDiagnosticFalsePositive' -timeout 300s

  # 证据 / 口径一致性门禁：双语言机验证据包 + 单一真值源健康度。
  # 防止「求解器注水 / 能力回退 / 口径塌缩」回归，每次 PR/push 自动拦。
  # 纯 Python（基准套件本体为标准库，仅 padding-oracle judge 需 pycryptodome）；
  # Go 侧权威机验由上方 capability-gate 覆盖，本 job 不重复跑 Go。
  # 证据一致性闸门（合并自原 evidence-gate + evidence-package-gate，2026-10-24 去重）：
  # 原来两 job 各自完整重跑一遍全量基准（pip 装依赖 + regen fixtures + run_all_benchmarks.py），
  # 最贵的两步被做两次。合并后只跑一遍，依次做两路一致性检查：
  #   ① 证据包（§4.1）：docs/evidence-package.json 的对外数字须与活值一致，漂移即 BLOCK；
  #   ② 证据/口径：docs/evidence.json 的 provenance 零覆盖曾静默报绿，现 fail-closed。
  # 两路门禁自身都有回归测试 + 变异验证（证明它能真变红，不是恒 PASS）；
  # 证据包门禁的变异验证首次运行即抓到自身 2 个真 bug（golden/gates 比对误用 benchmark 子字典）。
  # 装 Go 是为了让 count_stats.go_packages 取到真值（否则该字段为 null，比对自动跳过）。
  evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 装 Go 是为了让 count_stats.go_packages 能取到真值（否则该字段为 null，比对会自动跳过）
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Install benchmark deps (pycryptodome + pillow for judges)
        run: python -m pip install --upgrade pip && pip install pycryptodome pillow
      # 执行基准集两道 git 历史题（exec_git_repo / git_cred_repo）含嵌套 .git，依设计不入库，
      # 重新生成后 judge_exec.py 的 execution 块才能 15/15（否则静默 13/15 漏检）。
      - name: Regenerate execution fixtures (nested .git repos not committed by design)
        run: python data/ctf_benchmark/regen_exec_fixtures.py
      - name: Regenerate dual-language benchmark summary
        run: python data/ctf_benchmark/run_all_benchmarks.py
      # ---- ① 证据包一致性（§4.1）----
      # 门禁自身也要有回归测试（2026-10-14 门禁审计）：cmp(skip_if_none=True) 会把
      # 「live 侧整段采集失败」（count_stats 挂 / summary 缺 / gates 未采）逐字段跳过
      # → 零漂移报 PASS。现结构性 fail-closed 并由本步实跑自测。
      - name: Evidence package gate self-test (missing live values must NOT pass)
        run: python scripts/build_championship_evidence_test.py
      - name: Championship evidence package consistency (drift => BLOCK)
        run: python scripts/build_championship_evidence.py --check
      - name: Evidence package gate mutation check (prove the gate can fail)
        run: python scripts/evidence_package_mutation_check.py
      # ---- ② 证据 / 口径一致性 ----
      # provenance 零覆盖曾静默报绿（total_problems<=0 时三条自洽检查自动成立），现 fail-closed 并由本步实跑自测。
      - name: Evidence gate self-test (zero-coverage provenance must NOT pass)
        run: python scripts/verify_evidence_test.py
      - name: Evidence / caliber consistency gate
        run: python scripts/verify_evidence.py

  # 决赛冻结纪律闸门（规划总纲 §4.3）：决赛前 14 天起拒绝"架构改动"的 PR。
  # 目的：09-12 定下的停工边界③"距决赛 < 14 天 → 不动架构"此前只写在文档里，
  # 本 job 把它变成可机验的闸门（改 internal/ agents/ cmd/ 一律 BLOCK）。
  # 策略由 config.share.yaml 的 freeze 段驱动：未武装（enabled=false）时 SKIP，不阻塞日常开发；
  # 决赛日期确定后置 enabled=true + final_date 即自动生效。
  freeze-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要 base commit 才能做 base...HEAD 的改动比对
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze gate self-test (prove the gate can actually block)
        run: python scripts/freeze_gate_test.py
      - name: Freeze gate status (armed? window?)
        run: python scripts/freeze_gate.py --status
      - name: Freeze gate (reject architecture changes inside freeze window)
        if: github.event_name == 'pull_request'
        run: python scripts/freeze_gate.py --base "${{ github.event.pull_request.base.sha }}"
      # 决赛交付物上锁（2026-10-10）：压缩包 / 答辩 PPT / 演示视频 的 sha256 记于
      # docs/final-artifacts.freeze.json，任何改动即 BLOCK。这些产物被 .gitignore 排除，
      # CI 检出里通常不存在 → 脚本会优雅 SKIP（不会造成恒红）；本地有产物时严格校验。
      - name: Final artifacts freeze gate self-test (empty manifest must NOT pass)
        run: python scripts/check_final_artifacts_freeze_test.py
      - name: Final artifacts freeze (压缩包/答辩PPT/演示视频 未被改动)
        run: python scripts/check_final_artifacts_freeze.py

  # 交付二进制来源门禁（2026-10-18）：发出去的 exe 必须由当前 HEAD 构建。
  # 实锤事故：交付包里同时躺着 09-04(+dirty) / 09-07 / 09-30 三份构建，没有一份是
  # 当前源码的产物，而源码期间修掉了 7 critical + 8 high 依赖漏洞与 presolve 短路。
  # 文件名和体积都看不出来，只有读 Go buildinfo 才能判定。
  # CI 里 exe 未入库（.gitignore）→ 无实物可比，故这里做两件事：
  #   ① 自测证明门禁逻辑真能红（含"安装包解不出 payload 也算红"）；
  #   ② 用 release 同款参数**现场编一份** windows exe 再过门禁 ——
  #      既证明构建参数还产得出可解析的 buildinfo，也证明门禁在真产物上不误杀。
  binary-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Binary version gate self-test (stale/dirty/unverifiable must NOT pass)
        run: python scripts/check_binary_version_test.py
      - name: Build Windows exe with release flags
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-H windowsgui -w -s" -o installer/secautomind-ai.exe ./cmd/server
      - name: Binary version gate on a fresh HEAD build
        run: python scripts/check_binary_version.py

  # 决赛整链路演练（规划总纲 §2.1 的 e2e 要求，去掉"必须用官方平台"那部分）。
  # 既有测试是**组件级**的；这一路把「仿真 DASCTF 平台 + 真实 Poller + 真实求解器」串起来跑：
  # 拉题（含注入 429）→ 并发求解 → 提交（剥离外壳）→ 判分 accepted，并验证
  # 解不出的题不提交（保护每题约 50 次机会）、每题只提交一次、第二轮去重。
  # 它同时是冻结期（第七条）"演练"这一项的一键入口，CI 日志里会留一张赛况快照表。
  finals-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Ensure gcc for -race (runner image ships one; install only if missing)
        run: |
          if command -v gcc >/dev/null 2>&1; then
            echo "gcc already present: $(gcc --version | head -1)"
          else
            sudo apt-get update && sudo apt-get install -y gcc
          fi
      - name: Finals full-loop rehearsal (simulated platform + poller + solver)
        run: go test -race -count=1 -v -run 'TestRehearsal' ./internal/ctfplatform/ -timeout 300s
      # 10-05 补：真实靶机端到端。TestRehearsal 的 flag 在题面文本里（静态抽取即得），
      #   测不到真实靶机；TestLiveTarget 起真 HTTP 靶机（真漏洞），走
      #   平台投递 → 起靶机 → 地址注入 → 真实 HTTP 探测 → 提交判分 全链路。
      #   这正是 55 题真题库 36 道未命中里 21 道 web 题的真实形态。
      #   含反向用例 TestLiveTargetFailsWithoutEnvInjection（关掉注入必须全失败），
      #   用来证明正向通过确实来自那条链，而非断言写松。
      - name: Live target end-to-end (real vulnerable HTTP targets, full chain)
        run: go test -race -count=1 -v -run 'TestLiveTarget' ./internal/ctfplatform/ -timeout 300s
      # 10-13 补：平台层端到端生命周期契约（规划 §7 验收清单第 1 条 `-run E2E`）。
      #   与 TestRehearsal（多场景演练/压力/并发）分工不同：本 step 串跑单一资格线
      #   拉题 → 起靶机 → 取访问地址 → 提交 flag → 校验 accepted → 回收靶机，
      #   并反向断言「错误 flag 不得被判 accepted」——防"假阳性满分"这类最难发现的失信。
      #   🔴 诚实边界：本用例基于 httptest 模拟平台，**不等于官方仿真平台真机联调**
      #      （规划 §6：单测不可替代真机实测，真机联调仍是独立待办）。
      - name: Platform E2E lifecycle contract (qualification chain, anti-false-positive)
        run: go test -race -count=1 -v -run 'TestPlatformE2E_Lifecycle' ./internal/ctfplatform/ -timeout 300s
      # 10-05 补：决赛开赛一键上膛脚本 finals_arm.sh 必须在 Linux 上能直接跑
      #   （现场若连语法错都跑不起来，6 个开关就全漏了）。语法错在本机测不出来 ——
      #   本地是 Git Bash + Windows，CI 才是真 Linux 目标环境。
      - name: finals_arm.sh syntax check (day-of one-liner must be runnable on Linux)
        run: bash -n scripts/finals_arm.sh
      # 10-24 补：`bash -n` 只验语法，验不出「source 时 exit 杀掉操作者 shell」这类语义 bug。
      #   实测事故：source 推荐的用法走到末尾 `exit $rc`，终端一关，export 的开关随进程消失，
      #   重开新终端又是全 OFF —— 静默失能（poller 不启动/不自动提交/靶机题全 MISS），现场无报错。
      #   本用例含 1 项**因果自变异**（把末尾守卫换回裸 exit，断言必须失败），证明不是恒绿。
      - name: finals_arm.sh semantic regression (source must not kill the operator's shell)
        run: bash scripts/finals_arm_test.sh
      # 10-05 补：预检脚本的 GO/NO-GO 定级逻辑必须有回归测试。
      #   预检结论直接决定"是否开赛"，而门禁全绿时没人会去核对那个结论 ——
      #   定级写反 = 现场拿到与事实相反的 GO（10-04 已栽过同类的门禁失效事故）。
      - name: Finals preflight self-test (verdict logic must stay provable)
        run: python3 scripts/finals_preflight_test.py

  # A→B 同卷立尺 · 有数据子集（12/88 题附件仍在）：从 test job 拆出的独立门禁。
  # 为什么独立：本地实测 29.6s~242s 波动（presolve 扫描超时不定时触发），并进
  #   test job 的 -race 900s 总预算会把整 job 顶穿 → 间歇性红灯会训练团队"忽略红"。
  # 为什么不 -race：presolve 是逐题纯函数调用，测试自身无并发面，race 只增耗不增覆盖；
  #   超时预算按本地最坏 242s 的 2.5 倍设 600s。
  # 判定语义（与 test job 内其他测试不同，读码前先读懂）：
  #   · 命中率只报告不断言——12/88 是部分完整输入，拿命中率问责会逼出"为转绿改阈值"；
  #   · 但「附件清单与磁盘实物脱节」fail-closed 直接红（非 git 排除文件缺失即 Errorf）——
  #     本项目死于"声明了却不存在"，这条红线禁止为转绿删除。
  #   · CI 检出不含 4 个 flag 明文/内嵌答案附件（attachments/.gitignore，PUBLIC 仓交付
  #     红线），故「含答案口径」在 CI 上自动降级为剔除口径，属预期而非故障。
  cross-bench-subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Cross-bench attachment subset (report-only hit rate, fail-closed manifest)
        run: go test -count=1 -v -run 'TestCrossBench_AttachmentSubset' ./internal/ctfplatform/ -timeout 600s
      # 2026-10-24 追加：二进制附件子集（bin_flag_repair 修复链的立尺；含/剔除答案
      # 双口径。upx 附件 git_excluded 仅本地存在——CI 含答案口径该题 exp-missing，
      # 剔除口径 5/12 基线在 CI 可复现，本地含答案 6/12 为增强口径）。
      - name: Cross-bench binary attachment subset (report-only, dual caliber)
        run: go test -count=1 -v -run 'TestCrossBench_BinaryAttachmentSubset' ./internal/ctfplatform/ -timeout 600s

  # 密钥门禁：防止真实凭证被提交进仓库。
  # 历史教训（两次）：
  #   ① 2026-09-08：旧的打包前 grep 正则 `sk-[A-Za-z0-9]{16,}` 匹配不到 `sk-ws-H...`
  #      （第 4 位是连字符即断匹配），一把真 key 从洞里漏过而门禁报 CLEAN。
  #   ② 2026-09-13：`is_placeholder` 把 `...` 当无条件占位特征，于是人工打码后的
  #      真 key 片段被判为"安全"，随交付包外发给了评委。
  # 失效的门禁比没有门禁更危险 —— 它会持续给出假的安全感。
  # 因此本 job 跑三层：门禁本体 → 门禁自测 → 门禁变异验证（证明自测真能杀死退化）。
  secret-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ⚠️ CI 容器内既无 config.yaml 明文、也无 User 级环境变量 → 指纹库必然为空。
      #    门禁默认对此 fail-closed（BLOCK），故此处显式降级为「仅形态匹配」，
      #    并把"未启用指纹反查"的事实留在日志里。真正的最强防线由本地打包路径强制启用
      #    （make_delivery_package.py 不传该标志 → 取不到指纹即拒绝打包）。
      - name: Secret guard (form-pattern only in CI; real fingerprint check is enforced locally)
        run: python scripts/secret_guard.py --allow-no-fingerprint
      - name: Secret guard self-test (must still catch the leaks it once missed)
        run: python scripts/secret_guard_test.py
      - name: Secret guard mutation check (prove the self-test can kill regressions)
        run: python scripts/secret_guard_mutation_check.py
      - name: Plaintext CTF flag gate (precision + policy + freeze-baseline end-to-end)
        run: python scripts/secret_guard_flag_test.py
      # 跨语言判据一致性（2026-10-25）：同一个「占位符」判据在 Go 引擎与 Python 门禁
      # 各写一份，靠手抄同步 → 实测抄漏 7 个词、自造 1 个词、缺低信息量检查，
      # 导致同一条串 Go 判「不是 flag」、Python 判「真泄露」。本步解析 Go 源码逐项比对，
      # 漂移即红；只读源码文本，不需要 go 工具链。
      - name: Flag-rule parity gate (Go presolve ⇄ Python secret_guard must not drift)
        run: |
          python scripts/check_flag_rules_parity.py --check
          python scripts/check_flag_rules_parity_test.py
      # 溯源审计的互校断言（2026-10-25）：审计脚本与门禁是两条独立扫描路径，
      # 它们的命中总数必须相等 —— 对不上就说明有一边漏扫/多扫，那"铁实锤 N 条"
      # 这个数字本身就不可信。不跑审计本体（只跑测试），避免 CI 依赖本地真值文件。
      - name: Flag provenance audit cross-check (audit total must equal gate total)
        run: python scripts/audit_flag_provenance_test.py
      - name: Generator flag externalization self-test (must fail-closed when truth missing)
        run: python scripts/externalize_generator_flags.py --selftest
      # 交付包排除面门禁（2026-10-24）：secret_guard 只按密钥形态匹配，判不出
      # 「会话记忆里中文写着的账号/密码」。而交付包此前只排除 `.workbuddy/`，
      # `.workbuddy-ai/`（AI 协作记忆目录）不在列 → 重打包会把凭证随包发给评委。
      # 本步锁住排除表本身，并含变异验证（摘掉条目必须泄漏），防止它被改回摆设。
      - name: Delivery package exclusion gate (agent state must never ship)
        run: python scripts/make_delivery_package_test.py

  # 材料口径门禁：docs/ PPT/ 官网 里的关键数字必须与 count_stats.py 真值一致。
  # 供应链门禁（十一防线 G-02，2026-10-24 新增）。
  # 此前对"到底依赖了什么"零证据：requirements.txt 里 0 个 `==`、全是 `>=`
  # （装到什么版本取决于当天 PyPI），Go 侧虽有 go.sum 可复现，却没有清单能回答
  # "发了哪些模块、各是什么版本"，出事时无法判断某个 CVE 影响不影响我们。
  # 三条判据：C1 SBOM 与依赖树逐字节一致 / C2 go.mod 每个 require 在 go.sum 有哈希
  # （含 replace 解析——第一版忽略 replace 就误报过一次）/ C3 依赖清单非空
  # （解析失败必须红，不许"扫到 0 个依赖 → 全绿"）。
  # 不做 CVE 扫描：离线无本地库，任何"漏洞数=0"都是假的；SBOM 的 vulnerability_scan
  # 字段固定 not_run 并注明原因，这是诚实位。
  supply-chain-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SBOM consistency (go.sum coverage / requirements parse)
        run: python scripts/check_supply_chain.py
      - name: Supply-chain gate regression + mutation check (prove the gate can fail)
        run: python scripts/check_supply_chain.py --self-test

  # 历史教训：材料数字漂移出现过三次，全靠人肉发现（工具数 90→91、求解器数 169→170 等）。
  # 写死的数字在提交完成的下一秒就可能过期，靠人肉同步永远追不上。
  # 真值源一致性门禁（2026-10-05 · 西湖论剑 CTF-Agent 跨项目支持引入）。
  # 背景：本项目曾出现"评测校验器从退役题库取答案表 → 正确 flag 被判幻觉并丢弃"的对齐事故
  # （外部项目 2026-09-19 实测：当日 1/10 实为冤案，修复后 3~4/10）。该类事故静态看代码
  # 发现不了（两边都"有哈希校验"），只能机器对账。本门禁把两类注水常态化挡住：
  #   ① 外部来源题集出现明文答案（答案键与题面同文件 → 求解器可见 → 能力数字失真）；
  #   ② 同一题 id 在多处登记了不同 flag_sha256（真值分裂）。
  # 变异验证（2026-10-13 补齐）：scripts/_audit_truth_sources_test.py 覆盖**每个可达
  # 检查项的红/绿两态**，并用「把某条判据改成恒不报红 → 对应用例必须转绿」证明每处红例
  # 都是因果的、而非恰好为红。此前本条注释声称"测试已覆盖每个检查项的红/绿两态"，但
  # 该测试文件在仓库里并不存在（不实自证声明）——现已落成实体并由本 job 实跑，任何人把
  # 门禁改成摆设都会当场变红。
  # 同批修复：检查 #1（duplicate_id_within_file）曾**不可达**（重复 id 在 dict 去重阶段
  # 被静默合并 → 永远 ✅，属装饰性门禁），现改为在去重前按声明顺序扫描。
  # 姊妹门禁 _audit_llm_pool.py 同批补齐（2026-10-13）：它此前既无自测、又有**空洞绿**
  # ——池文件缺失/解析 0 题 → 空池 → all_green=True **静默报绿**（口径从未被校验，门禁却
  # 一直给绿灯），verdict 还输出与事实相反的"评测池含自建题"。现改 fail-closed，
  # 并落成 scripts/_audit_llm_pool_test.py（11 项，含 M1/M2 因果自变异）由本 job 实跑。
  truth-source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Truth-source coherence gate (no plaintext answers in external sets / no truth divergence)
        run: python scripts/_audit_truth_sources.py --target .
      - name: LLM evaluation pool caliber gate (self-authored vs external-truth denominator)
        run: python scripts/_audit_llm_pool.py --target .
      - name: Truth-source gate regression + mutation check (prove it can fail)
        run: python scripts/_audit_truth_sources_test.py
      - name: LLM pool gate fail-closed + regression + mutation check
        run: python scripts/_audit_llm_pool_test.py

  # 验收第 8 条：对外量化陈述 100% 可指回 —— 真跑命令复现，而非口头声明。
  # 跑 --full（全 6 条：两条真题覆盖率 + 自研集 + 执行/Web/附件层）。
  # 实测全量仅 ~19s，故不拆分档：拆档只会给"少跑几条"留借口。
  # （脚本仍保留 quick/slow 分档能力，供超大基准集时应急降级。）
  quant-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 必须与其他跑分 job 一样先生成执行层 fixture：其中 2 题是 **git 仓库型**
      # （`judge_exec.py` 真跑 `git log -p` 挖历史泄露 flag），嵌套 .git 按设计
      # 不入库。缺这一步 CI 实测只有 15/17（本机因跑过所以 17/17）——
      # 首次挂门禁就是被这条打红的。
      - name: Regenerate execution fixtures (git-repo fixtures are not committed)
        run: python data/ctf_benchmark/regen_exec_fixtures.py
      # 基准集套件 claim 会真跑 run_all_benchmarks.py，其中 padding-oracle judge 依赖 pycryptodome
      - name: Install benchmark deps (pycryptodome + pillow for judges)
        run: python -m pip install --upgrade pip && pip install pycryptodome pillow
      - name: 对外量化陈述机验（声明 vs 实测，全量）
        run: python scripts/check_quant_effect.py --full
      # 空洞绿自测（2026-10-14 门禁审计）：全 slow / 缺 command 曾让本门禁"零机验却报全绿"
      - name: Quant gate self-test (all-slow & unverifiable claims must NOT pass)
        run: python scripts/check_quant_effect_test.py
      # 门禁自身也要有回归测试：证明基准集达标判定真能杀死退化，而不是恒 PASS/恒 FAIL
      - name: Benchmark baseline gate self-test (prove it can fail)
        run: python scripts/check_benchmark_baseline_test.py
      # XSS 基准集自测（2026-10-23）：回归 3/3 + 变异 --safe 必须 0/3（证明判题器非空洞绿）
      - name: XSS benchmark self-test (regression + mutation)
        run: python scripts/check_xss_benchmark_test.py

  # 材料口径总闸（17 步）：材料数字 / 文档事实 / 范围豁免准入 / 工具与配方契约 /
  # 错误投影 / 产物数字 / PPT 产物路径，逐个与单一真值源比对。每步都自带自测，
  # 因为这类门禁最常见的失效方式是「扫到 0 个文件 → 无条件全绿」。
  caliber-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 配方契约审计要解析 tools/*.yaml，而 PyYAML 不在 requirements.txt
      # （那份只管工具运行时，不管审计脚本）。ubuntu runner 的 Python 不保证预装，
      # 故显式装——与本文件其它「pip install pycryptodome」步同一惯例。
      # 脚本本身在缺 PyYAML 时 exit 2（fail-closed），不会静默放行。
      - name: Install PyYAML for recipe contract audit
        run: python -m pip install --upgrade pip && pip install pyyaml
      # 门禁自身也要有回归测试（2026-10-14 门禁审计）：本门禁结论全由「违规项计数」
      # 构成，扫到 0 个文件（目录名写错 / 被 gitignore / 扩展名被改空）时会无条件全绿。
      # 现 fail-closed（覆盖数为 0 即红）并由本步实跑自测，同时锁死豁免机制不退化。
      - name: Material-number gate self-test (zero files scanned must NOT pass)
        run: python scripts/check_material_numbers_test.py
      - name: Material numbers vs single source of truth
        run: python scripts/check_material_numbers.py
      # 文档事实门禁（2026-10-20 新增）：AGENTS.md 是材料门禁的 EXEMPT_FILES
      # （规范文档必须列举旧数字才能说明规则，列举 ≠ 使用），但豁免制造了盲区——
      # 其「N YAML + K 内置 = R 运行时」分解式示范是**现行事实的示范**而非枚举，
      # 实测 91/143 已漂移过一轮且无任何判据能看见。由本门禁兜底。
      - name: Doc-facts gate self-test (6 mutations + 2 fail-closed)
        run: python scripts/check_doc_facts_test.py
      - name: Doc facts vs single source of truth
        run: python scripts/check_doc_facts.py
      # 范围边界准入清单（2026-10-20 新增，REA #169）：豁免必须有审计日期、
      # 准入理由、到期日。缺字段或过期 = 没有准入（过期条目比新增条目更危险：
      # 它看起来"已经被批准过"）。空清单是合法状态——没裁定过就不该有准入。
      - name: Scope allow-list self-test (missing expiry / vague reason must FAIL)
        run: python -X utf8 scripts/scope_allowlist_test.py
      - name: Scope allow-list validity (expired entries block)
        run: python -X utf8 scripts/scope_allowlist.py --check
      # 工具契约四件套（2026-10-20 新增，REA #176）：MCP 对外契约 = 错误投影 /
      # 入参 schema / 响应预算 / 溯源，不是"能跑通"。这里只把**硬缺陷**设为阻断：
      # T0 常驻工具缺 InputSchema 或 required。错误投影现状（12 个 T0 拼 err.Error()）
      # 是已登记缺口，见 docs/工具契约与输出边界-2026-10-20.md，暂不阻断。
      - name: Tool contract sampler self-test (constant names / fail-closed)
        run: python -X utf8 scripts/audit_tool_contracts_test.py
      - name: T0 tool contracts (InputSchema + required)
        run: python -X utf8 scripts/audit_tool_contracts.py --gate
      # 错误投影（2026-10-21 收窄，REA #10/#176）：26 处 `textResult("错误: "+err.Error())`
      # 已收敛到 toolInternalError（对外只出可行动文案、原文进日志），只保留 4 处入参
      # 校验直出并登记基线。**纯 Python 守卫，不占 Go 额度**：Go 侧改动已由服务器
      # `go build` + `go vet` + `go test ./...` 验证（本机无 Go 工具链，见总账 HUNG 项）。
      - name: Error-projection gate self-test (new leak must be red)
        run: python -X utf8 scripts/check_error_projection_test.py
      - name: Error projection (no new err.Error() leaks beyond baseline)
        run: python -X utf8 scripts/check_error_projection.py --gate
      # 工具**配方**（tools/*.yaml，89 份真声明）的契约：与上面的内置 MCP 工具
      # 是两条完全不同的链路（注册表 vs 命令行拼装），四维度不能照抄，故单独一套
      # 解析与门禁。除四维度外还做「与 count_stats.tools_yaml 的口径对账」——两个
      # 独立计数器差值无法逐项解释时变红（这正是 risk_policy 虚报 92 的复现路径）。
      - name: Recipe contract sampler self-test (bad samples must be red)
        run: python -X utf8 scripts/audit_yaml_tool_contracts_test.py
      - name: Tool recipe contracts + count reconciliation
        run: python -X utf8 scripts/audit_yaml_tool_contracts.py --gate
      # 环境指纹（2026-10-20 新增，REA #33/#239）：块会随基准产物公开，故必须自测
      # "不含绝对路径、不写环境变量原值、取不到的项进 unknown 而不是填默认值"。
      - name: Env fingerprint self-test (no path/secret leak)
        run: python -X utf8 scripts/env_fingerprint_test.py
      # 门禁自身也要有回归测试：修复器复用门禁的 ANCHORS 表，若哪天两者判定分叉，
      # 会出现「修复器说修好了、门禁说还红」的隐蔽失效。10 项含 4 项变异验证
      # （故意注入漂移数字、故意破坏千分位逻辑，测试必须变红）。
      - name: Material-number fixer self-test (regression + mutation)
        run: python scripts/fix_material_numbers_test.py
      # 产物门禁（读回 .pptx/.docx/.pdf）的回归自检。产物是 .gitignore 的本地件
      # （几 MB～60 MB 二进制），CI 检出里**根本不存在**，所以 CI 只能守"门禁本体逻辑正确"：
      # 用 stdlib 手搓的最小 pptx/docx 夹具跑 10 项，含 2 项变异（改错数字必须变红）、
      # 1 项 fail-closed（损坏产物必须拦下）、2 项跨形状方向判据。
      # 真实产物的检查落在打包那一刻（make_delivery_package.py 第五条红线）与本地自检。
      - name: Artifact-number gate self-test (16 cases, incl. mutation + always-exclude)
        run: python scripts/check_artifact_numbers_test.py
      # 生成器 → 产物 的**落点**链路（2026-10-18 新增，可直接在 CI 跑：纯 AST 静态判据，
      # 不需要那位 60 MB 的产物）。实测三个 PPT 生成器的 OUT 全都指向
      # `E:/Program/2026挑战杯：SecAutoMind-v1.7.17-share/…` —— 该目录早已不存在：
      # 生成器一跑就崩（假齐备），即便存在产物也落在冻结清单/交付包之外 → 仓库内那份
      # 永不更新，数字漂移静默复发。判据：OUT 必须锚定 __file__、落在仓库
      # SecAutoMind_PPT/ 内、是该目录下的冻结清单交付件、且实物存在。
      - name: PPT generator OUT must stay inside repo + frozen manifest
        run: python scripts/check_artifact_numbers.py --generators-only

  # cross-bench 产物清单一致性门禁（2026-10-16 实锤三条漂移后新增）。
  # `data/questions_real_bench/` 的 cross_bench.json 与 attachments/.gitignore 是
  # `scripts/build_cross_bench.py` 的产物，却曾被手工改过两轮（PR #22 建清单、
  # `a87b812` 清理题面 flag 明文）而生成器没同步，且生成器不在 CI 里跑 → 漂移静默。
  # 实跑生成器（A 库本机仍在，旧注释所称"已不存在"是伪前提）暴露三条：
  #   ① 生成器不知道要排除 P0 红线文件 10733/task.py → 重跑会把该行从 .gitignore
  #      摘掉，此后任何 `git add -A` 都会把它重新纳入 PUBLIC 仓；
  #   ② 生成器不遮蔽题面里的真 flag 明文 → 重跑会把 a87b812 已清掉的 2 条真 flag
  #      重新写回产物（重跑一次 = 再泄一次）；
  #   ③ honesty 自报计数停在 4 而实物是 5。
  # 本 job 把「产物 / .gitignore / 生成器契约表」三方钉成机器判据（含红线钉），
  # 并跑变异自测证明判据真能变红（含"生成器漏登记 10733"的真实回归形态）。
  # 2026-10-16 口径再审（本仓门禁自述"裸参数是题目输入"为仲裁）：10733/task.py 的
  # flag 是 b'******' 遮蔽态、与同批 ezrsa/filterrandom 等附件同类 → 属**题目输入**，
  # 排除已撤销、按输入入库，题面同步中性化。据此新增**反向钉** C9（须"不排除"，被重排除即红）
  # 与 C10（题面中性化覆盖）；自测扩到 21 例。正向钉（须排除）与反向钉同等为硬判据。
  cross-bench-manifest-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-bench manifest gate self-test (21 cases, incl. mutation)
        run: python scripts/check_cross_bench_manifest_test.py
      - name: Cross-bench manifest consistency (artifacts vs .gitignore vs generator)
        run: python scripts/check_cross_bench_manifest.py
      # 能力分母门禁（2026-10-25）：honesty 段自报的「12 题有附件」从未对过磁盘，
      # 导致所有「命中 X/88」「命中 6/12」的分母都没有机验来源。本门禁区分四档：
      #   FULL(在盘) / LOCAL_ONLY(git 排除但本地留) / DATA_ABSENT_EXCLUDED(排除解释得通)
      #   / DATA_ABSENT_LOST(既未排除也不存在 = 静默丢文件 → 必须红)。
      # CI 检出天然缺 git 排除文件，故 CI 侧分母 8、设计性缺失 4（不误报）。
      - name: Capability denominator gate self-test (11 cases, mutation)
        run: python scripts/bench_capability_denominator.py --self-test
      - name: Capability denominator gate (self-report vs disk, data-loss fail-closed)
        run: python scripts/bench_capability_denominator.py

  # 前端资源副本一致性门禁：根 web/ 与 internal/app/web/ 是**两份物理副本**，
  # 而 go:embed（internal/app/app_webfs.go，路径相对包目录）嵌入的是后者。
  # 只改根 web/ 而不同步 → 前端改动在 exe 里完全不生效且无任何报错。
  # 历史教训：commit 8805a04「fix: sync wizard frontend into embed source」即一次手工补同步。
  # 合法差异：.gitignore 全局忽略 vendor/，仅反忽略 internal/app/web/static/vendor/
  # （故全新 clone 下根 web/ 为 62 个文件、嵌入副本为 71 个，二者交集必须逐字节一致）。
  # 与 secret-gate 同规格：门禁本体 → 变异验证（证明门禁真能变红）。
  web-parity-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Web asset copy parity (drift => BLOCK)
        run: python scripts/check_web_asset_parity.py
      - name: Web parity gate mutation check (prove the gate can fail)
        run: python scripts/check_web_asset_parity_test.py

  # CSS 影子块门禁（2026-10-19 新增）。背景：style.css 里两个同名同特异性
  # `.external-tool-badge` 定义靠出现顺序决胜，靠后的蓝色定义把全局徽章刷成错色
  # （HANDOFF §16/§17）。全量审计：6,696 个顶层块里 130 组同名选择器。
  # 本门禁只拦「可证明安全」的那一类（每属性都被更靠后、**重要性不更低**的
  # 同选择器块覆盖 ⇒ 删除无任何副作用），--check 发现即红；
  # 「部分存活」组（前块有属性未被可靠覆盖）是需人工判定的技术债，只报告不动。
  # 🔴 importance 必须参与判定：2026-10-19 首版 analyse() 只按"后来者必胜"，
  # 实删前复核发现被删块含 15 处 !important —— 若某处只被后来块的普通声明覆盖，
  # 删除会把生效值从 important 旧值换成普通新值，而等价性验证（同样 importance
  # 盲）看不见。自测含该反向变异用例 + 级联表 4 项 + 端到端 --apply + 空扫防呆。
  css-shadow-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CSS shadow-block gate self-test (importance-aware, 24 cases incl. mutation)
        run: python scripts/css_shadow_audit_test.py
      - name: No provably-dead CSS shadow blocks (new ones => BLOCK)
        run: python scripts/css_shadow_audit.py --check

  # 前端运行时测试：`internal/app/web/static/js/*.test.cjs` 曾长期是**孤儿测试**——
  # ci.yml 全文没有 node --test，全靠人手跑，于是两条断言在实现重构后**静默腐烂**。
  # 2026-10-18 首次全量跑（131 例）实测 2 处 FAIL：
  #   · hitl-approval-ui：仍断言 `csaiHitlDefaultReviewerReady = initHitlDefaultReviewerFromServer()`，
  #     而实现已改为 ConfigReady 持 promise、ReviewerReady 作别名；
  #   · hitl-conversation-isolation：仍断言 `window.csaiHitlDefaultReviewer = v`，
  #     而实现已改为委托 applyHitlDefaultConfigFromServer。
  # 语义未变、只是断言过期；已按现实现改写（不是放宽断言，而是同时查「委托关系 + 赋值点」）。
  # 这些测试读 web/static/js/*.js 做文本断言，不需要浏览器，Node 原生 test runner 足够。
  # 已做 CI 仿真：`git -c core.autocrlf=false archive HEAD` 出纯 LF 检出后 131/131 通过。
  web-js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Front-end runtime tests (node --test)
        run: node --test internal/app/web/static/js/*.test.cjs

  # 行尾门禁：脚本行尾此前是「各机器 core.autocrlf 说了算」的盲区（本仓无 .gitattributes）。
  # 实锤缺陷：run.sh / upgrade.sh / plugins/*.sh 等工作副本为 CRLF，而
  # scripts/make_delivery_package.py 走 shutil.copy2 **字节级复制**（不经 git 过滤器），
  # 于是 CRLF 的 .sh 被原样打进交付包 —— 已对 dist/SecAutoMind-v1.7.25-share.tar.gz
  # 开箱复核：包内 run.sh=CRLF(501)、upgrade.sh=CRLF(411)。收件人在 Linux 上
  # `bash run.sh` 会直接报 `$'\r': command not found`，对「一键部署」是致命的。
  # 现由仓库根 .gitattributes 定死行尾，本 job 同时校验「仓内脚本行尾」与
  # 「.gitattributes ↔ 内置规则表 未漂移」，并带变异验证（证明门禁真能变红）。
  line-endings-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Script line endings (.sh=LF / .bat,.cmd,.ps1=CRLF)
        run: python scripts/check_line_endings.py
      - name: Line endings gate mutation check (prove the gate can fail)
        run: python scripts/check_line_endings_test.py

  # 文档端口一致性门禁：docs/ 里的 curl / 浏览器地址 / nginx `proxy_pass` / docker `-p`
  # 都是**可执行指令**，读者会直接复制；而交付包开箱的 config.yaml 端口是 18086
  # （8080 只是 config.example.yaml 的模板值 + cmd/server/main.go:90 的代码兜底）。
  # 历史上 docs 通篇写 8080，照抄必连不上；根因是一条错误注释
  # 「未启用 TLS 时为 http://localhost:8080」（端口与 TLS 无关）。
  # 真值源=config.share.yaml 的 server.port；材料线 competition-2026/ 跳过；
  # 豁免条目极小且有上限（豁免会腐化）。带变异验证（证明门禁真能变红）。
  doc-port-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Docs service-port consistency (truth = config.share.yaml)
        run: python scripts/check_doc_port_consistency.py
      - name: Doc port gate mutation check (prove the gate can fail)
        run: python scripts/check_doc_port_consistency_test.py

  # 文档静态门禁：代码块围栏闭合 / 本地链接可达 / scripts 引用存在 / 英文文档有中文对应。
  # 实锤缺陷：①决赛当天 runbook 有一段排查命令缺开头围栏 → 渲染错乱（标题被吞进代码块）；
  # ②docs 的 contributing-guide（中英文）与 go.mod 注释引用了从未存在的
  #   scripts/check-docs.py、scripts/bootstrap-go.sh → 读者照做必然失败。
  # 与 doc-port-gate 互补（那边管端口，这边管引用与结构）；带变异验证（证明门禁真能变红）。
  docs-lint-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Docs static lint (fences / links / script refs / bilingual parity)
        run: python scripts/check_docs_lint.py
      - name: Docs lint gate regression + mutation check
        run: python scripts/check_docs_lint_test.py
  # 文档结构门禁（十一防线 P-01/P-02/P-03/P-09/P-10 的机验部分）。
  # 守的是「文档结构会自己烂掉」：AGENTS.md 只增不删会撑爆常驻预算；路由表里的
  # 路径会随重构失效，而写错的路径看起来最像证据；docs/ 顶层文档只增不登记，
  # 索引一定漏；收尾清单会退化成空壳；门禁地图会与 ci.yml 脱节。
  # 六条判据：C1 AGENTS.md ≤300 行 / C2 路由表路径真实存在 / C3 docs 顶层全部登记且
  # 索引不指向空气 / C4 收尾清单八项齐备 + 取证边界段 / C5 顶层文档数只许减不许增 /
  # C6 docs/GATES.md 与 ci.yml 一致。带变异自测（6 类注入必须变红）。
  agent-docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Agent docs structure (budget / routes / index / closing list)
        run: python scripts/check_agent_docs.py
      - name: Agent docs gate mutation check (prove the gate can fail)
        run: python scripts/check_agent_docs.py --self-test
  # MCP 服务清单与契约一致性门禁。
  # 实锤缺陷（2026-10-14 审计，三类）：
  #   ① 索引漏列：mcp-servers/ 目录里实际有 3 个服务，两个 README 的服务表
  #      只列了 2 个 —— pent_claude_agent 长期「存在但索引查不到」，
  #      使用者按索引找服务必然漏掉它。
  #   ② 依赖谎报：security_triage_agent 文档写「零第三方依赖」，代码里
  #      却 try/except 导入 httpx —— 只有逐文件扫 AST 才看得见（读注释无用）。
  #   ③ 声明/实现漂移：README 工具表与 tools/list 可能各说各话，客户端按文档
  #      调用会打到不存在的工具，且此类错误只在运行时才暴露。
  # 三层校验：目录 ↔ 索引 ↔ tools/list；纯标准库服务再跑 8 项离线协议自证
  # （initialize / 通知不响应 / ping / tools/list / 未知工具报错 / 存活性 /
  # README↔tools/list 对齐 / --selftest）。带回归 + 变异验证。
  mcp-servers-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: MCP servers inventory / dependency / protocol consistency
        run: python scripts/check_mcp_servers.py
      - name: MCP servers gate regression + mutation check (prove the gate can fail)
        run: python scripts/check_mcp_servers_test.py
      # 出口契约门禁（2026-10-19）：每条工具结论必须自报权威等级 / 覆盖度 /
      # 限制 / 证据指纹，且降级不得伪装成功。14 项含 5 类变异——伪造
      # 「degraded 无原因」「unavailable 无限制」等坏契约，校验器必须变红。
      - name: MCP tool output contract (authority / coverage / limitations)
        working-directory: mcp-servers/security_triage_agent
        run: python contract_test.py

  # 守的是「声明齐全 ≠ 实物存在」：external_westlake 基准 80/80 题标着
  # payload_status=verified_on_disk，但附件是导出方仓库相对路径、本仓库 0 题可解析；
  # 同目录 judge --self-check 只验字段非空、不验 os.path.exists，照样报「问题=0」。
  # 当前状态 = 未挂载且未被引用（PASS）；一旦有人把它接进对外汇总，门禁立刻变红。
  external-payload-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: External benchmark payload must exist on disk once claimed
        run: python scripts/check_external_westlake_payload.py --check
      - name: External payload gate regression + mutation check (prove the gate can fail)
        run: python scripts/check_external_westlake_payload_test.py

  # 自产基准反注水：题干里不得直接写出答案。否则「解题率」不是模型解出来的，
  # 而是出题时写进去的 —— 这是自产集最容易、也最不体面的作弊方式。
  plaintext-answer-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No benchmark may hide its answer in the problem statement
        run: python scripts/check_benchmark_plaintext_answer.py --check
      - name: Plaintext-answer gate regression + mutation check (prove the gate can fail)
        run: python scripts/check_benchmark_plaintext_answer_test.py

  # 真题基准可解性基线：A 层 ≤4 题、C 层占比 ≤71.0%（实测 70.9%）。
  # 守的是「分母不许继续注水」，不是「已合格」——新增无输入的题会让占比越线即红。
  benchmark-validity-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 登记基线语义：A 层 <= 4、C 层占比 <= 71.0%（当前实测 70.9%）。
      # 守住的是「分母不许继续注水」，不是「已合格」——新增无输入的题会让占比越线即红。
      - name: Real benchmark must stay solvable-in-principle (no worse than baseline)
        run: python scripts/audit_benchmark_validity.py --check
      - name: Benchmark validity gate regression + mutation check (prove the gate can fail)
        run: python scripts/audit_benchmark_validity_test.py

  # flag 评测口径门禁（2026-10-28 建立）。
  # 为什么需要：基准 72 个 flag 全是小写 flag{，而 LLM 常输出大写 FLAG{...}；仓库里 10 个
  # 评测脚本有 9 个用小写-only 正则提取候选且直接拿原文算 sha256 —— 模型答对也被判未命中
  # （morse_hello 实锤：输出 FLAG{MORSE_CODE_HELLO} 被判 False）。这是**静默错误**：不报错，
  # 只让覆盖率数字安静偏低。S1–S4 报的数字可能因此被系统性低估。
  # 统一口径：scripts/experiments/flag_util.py::flag_sha256_hit
  #   （大小写不敏感提取 + 前缀归一 + 变体比对 + target 为空 fail-closed）
  # 存量违规走显式 allowlist 挂账（scripts/flag_eval_allowlist.json，含原因与责任人），
  # 挂账 ≠ 通过：门禁会打印挂账条数，发布节点前必须清零。
  flag-eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unified flag evaluation口径 (no lowercase-only regex, no raw-sha compare)
        run: python scripts/check_flag_eval_regex.py
      - name: flag_util self-test (7 cases incl. old-regex漏判反证)
        run: python scripts/experiments/flag_util.py
      - name: Gate regression + mutation check (prove the gate can fail)
        run: python scripts/check_flag_eval_regex.py --self-test

  # 并发会话登记表门禁（2026-10-28 建立）。
  # 守的是运行态纪律：S1–S5 并行会话会互相踩（真实事故：S5 07:12 起的实例 07:15 被别的
  # 会话杀掉；config.yaml 被并发改留下 .bak；本机隧道端口被占）。
  # 工具本身必须自证有效（7 项变异：同端口/同切片/超并发池必须被拒、僵尸必须可回收、
  # 登记表缺失必须显式降级）。CI 环境无并发登记表 → `check` 打印 DEGRADED 并跳过，
  # 属**显式降级**（AGENTS.md 第四条③），不是静默 PASS。
  session-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Registry consistency (degrades explicitly when absent on CI)
        run: python scripts/session_registry.py check
      - name: Registry gate regression + mutation check (prove it can reject)
        run: python scripts/session_registry.py --self-test

  # 双语言基准 parity 门禁（静态集 55 题）：把「Python judge.py 镜像 == Go 生产路径」
  # 这句**写在对外汇总里的宣称**真正接上线。
  # 为什么需要：run_all_benchmarks.py 的汇总里【1】～【8】各打印一句「Python == Go」的
  # 硬编码宣称（如「Python judge.py 镜像 == Go TestRealBenchmark_ShippedPresolve」），
  # 但没有任何代码校验；而它的基线比对只查
  # **下限**（hit < min_hit 才红），Python 侧**上漂**（镜像宣称生产做不到的命中 = 注水方向）
  # 与 Go 两条路径的**逐题**差异都无人看。这正是本项目反复吃亏的「宣称写进了对外汇总，
  # 却没人接线」（AGENTS.md 第八条）。
  # 判据：Go shipped / Go registry / Python 镜像 三路**逐题集合**一致 + 非空 fail-closed
  #       + id 不越界 + 不低于基线地板。门禁自测（含 7 向变异）在下一步证明其判别力。
  # 需 go + python 双工具链：跨语言 parity 无法只在一侧完成。
  benchmark-parity-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dual-language benchmark parity (Go shipped == Go registry == Python mirror)
        run: python scripts/check_benchmark_parity.py --check
      - name: Parity gate regression + mutation check (prove the gate can fail)
        run: python scripts/check_benchmark_parity_test.py

  # 跨集 parity 门禁（台账驱动）—— 把【2】～【22】的「Python == Go」宣称按台账逐集接线。
  # 背景：run_all_benchmarks.py 的汇总里 22 个集各打印一句「Python == Go」，长期只有【1】静态集
  # 真接了机验；PR #35 手写脚注「【2】～【8】未接线」本身即失真（实测未接线的是【2】～【22】，漏 14 集）。
  # 本门禁把「范围」从手写改成台账（data/ctf_benchmark/parity_registry.json）驱动 + 覆盖度自证：
  #   ① 台账必须登记汇总里每一个【N】集（漏登记=零覆盖也可能显 PASS，同型空洞绿）；
  #   ② wired 集必须带可执行判据（否则=哑门禁）；
  #   ③ wired 集两侧逐题命中集合必须一致且非空（超前=注水方向 / 滞后=宣称不成立 / 空=空洞绿）。
  # 新增集若要宣称接线，只需在台账加条目 + 两侧命中行正则，无需改本 workflow。
  suite-parity-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # execution 集的嵌套 .git 工件（exec_git_repo / git_cred_repo）依设计不入库，与 `test` job 同：
      # CI 校验前必须重新生成，否则 judge_exec.py 与 TestExecSolversAgainstBenchmark 会因缺 git 历史
      # 而 13/15 —— 且 Go 侧读取失败走 t.Errorf ⇒ 退出码非零 ⇒ 本门禁判据 5 直接报红。
      - name: Regenerate execution fixtures (nested .git repos not committed by design)
        run: python data/ctf_benchmark/regen_exec_fixtures.py
      # padding_oracle judge 需 pycryptodome（与 quant-gate / evidence-gate / evidence-package-gate 同）。
      # 后续若接线更多集，按各 judge 的 [DEPS-MISSING] 提示补齐这里。
      - name: Install benchmark deps (pycryptodome + pillow for judges)
        run: python -m pip install --upgrade pip && pip install pycryptodome pillow
      - name: Cross-suite dual-language parity (ledger-driven, all 【N】 suites enumerated)
        run: python scripts/check_suite_parity.py --check
      - name: Suite parity gate regression + mutation check (prove the gate can fail)
        run: python scripts/check_suite_parity_test.py


  # 外部真题对照尺（external-bench）—— 关闭「自产集高分 = 解题能力」的最后一个辩解出口。
  # 背景：对外最漂亮的数字是自产集 70/72 = 97.2%，但自产集是按求解器能力造的（开卷）。
  # 项目已明令「禁止把自产集当能力证据」，此前缺一把「外部 + 载荷齐全」的尺来实证：
  # cross-bench（A 库真题 88 题）只有 12/88 附件仍在，1/88 可被辩解为「数据缺失」。
  # 本尺取 Google CTF 2021–2025 共 40 题，**载荷齐全 38/40**，该辩解不成立。
  # 🔴 本 job **不为命中率问责**（实测 0/40）——只报告不断言，避免为转绿改阈值；
  #    但产物一致性（载荷台账 / 清单↔磁盘 / 未混入 KPI / 无 flag 明文）必须 fail-closed，
  #    否则"载荷齐全"这个唯一价值会被静默抹掉而没人发现。
  external-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 600s 实测不够：TextOnly ~3m45s + AttachmentSubset ~6m15s，慢 runner 上合计
      # 会顶满 10m 闹钟（PR #58 首跑 panic）。job 是 report-only，给足余量不 weaken 断言。
      - name: External bench scoring (text-only + attachment subset, report-only)
        run: go test -count=1 -v -run 'TestExternalBench' ./internal/ctfplatform/ -timeout 1800s
      - name: External bench artifact consistency (payload ledger / manifest / no KPI mixing)
        run: python scripts/check_external_bench.py
      - name: External bench gate regression + mutation check (prove the gate can fail)
        run: python scripts/check_external_bench_test.py


  # 解题 skill 可执行性门禁（2026-10-25）——堵死「skill 写在目录里但从未被调用」。
  # 背景：1024 快闪赛 9/9，其中 3 题靠人工补刀；核查发现 pwn_exploit_flow /
  # web_multi_step_chain 原为「纸面 skill」（run() 只返回流程文本 / 只枚举链条不发请求），
  # 对精确字节类题目零帮助。本 job 把「升级为可执行型」钉死：每个 skill 自带
  # --selftest，CI 上真跑一遍，跑不通即红。
  # 注：双写一致性（真值源 ↔ E:\Program\ctf-agent\skills）在 CI 上目标目录必然不存在，
  #     故 sync --check 在此为 SKIP（rc=0）——避免恒红假象；赛前本机必须加 --require-dst。
  skill-exec-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pwn_exploit_flow selftest - ELF parse / ret2win payload / socket exec
        run: python "CTF-Agent_融合/ctf_agent/skills/pwn_exploit_flow.py" --selftest
      - name: source_audit_patterns selftest - pattern scan + pickle payload
        run: python "CTF-Agent_融合/ctf_agent/skills/source_audit_patterns.py" --selftest
      - name: web_multi_step_chain selftest - multi-step API chain with slots
        run: python "CTF-Agent_融合/ctf_agent/skills/web_multi_step_chain.py" --selftest
      - name: Race preflight gate regression + mutation - docker path / dep drift / skills parity
        run: python scripts/race_preflight_test.py
      - name: Skill dual-write sync self-check - dst absent must SKIP, never false-red
        run: python scripts/sync_ctf_agent_skills.py --check
      - name: Engine watchdog selftest - kill child then auto-restart under 10s
        run: python scripts/engine_watchdog.py --selftest
      # ── 题库真值/附件判据的门禁（2026-10-26 补：此前写好却**未接 CI** = 等于没锁）──
      # 三者都是"判据作用域写窄了"导致的假绿/假红，实测事故见各测试文件头 docstring：
      #   ① check_question_truth: 附件算不出真值 ≠ 真值错（可能是答案在缺失文件里）
      #   ② _audit_corpus_integrity: is_file() 把目录形态附件误判为缺失
      #   ③ check_corpus_health: 基线 total=0 的池消失被当成回归（"曾有 0 题"自相矛盾）
      - name: Corpus truth self-test - partial attachments must NOT be judged as truth conflict
        run: python scripts/check_question_truth_test.py
      - name: Attachment resolver self-test - directory-form attachment must NOT count as missing
        run: python "CTF-Agent_融合/ctf_agent/scripts/_audit_corpus_integrity_test.py"
      - name: Corpus health self-test - empty-pool disappearance must NOT be a regression
        run: python "CTF-Agent_融合/ctf_agent/scripts/check_corpus_health_test.py"

  # 题库答案泄漏门禁（2026-10-28）
  # 背景：real 4 道 / benchmark 15 道题干直接内嵌正确 flag，喂 description 等于喂答案；
  # 门禁本体早已写好（scripts/check_benchmark_plaintext_answer.py）却**没接 CI** = 等于没锁。
  # 自测里带变异用例：往题面塞答案必须报红、flag 是已知输入不得误伤。
  answer-leak-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate self-test - statement-embedded answer must be flagged
        run: python scripts/check_benchmark_plaintext_answer_test.py
      - name: Benchmark statements must not embed answers
        run: python scripts/check_benchmark_plaintext_answer.py --check
