name: ci

# PR 门禁：每次 PR / push 到 main 自动跑 vet + 测试 + race 检测
# 对齐 release.yml 的 test-linux 逻辑，但触发范围更广、响应更快
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      # 注意：本项目 SQLite 驱动为纯 Go 的 github.com/glebarez/go-sqlite（无 cgo 依赖），
      # 不需要系统 libsqlite3-dev。下方 gcc 仅为 `go test -race` 的 race 运行时（C 实现）所必需。
      - name: Install build deps (gcc for -race; driver is pure-Go glebarez, no system sqlite)
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./... -timeout 900s
      - name: Build
        run: CGO_ENABLED=1 go build -trimpath ./cmd/server

  # 能力回归门禁：不依赖外部数据文件/在线靶场，纯 Go 内存级验证。
  # 防止「求解器注水 / 误报 / 注册表死代码」回归，每次 PR/push 自动拦。
  capability-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Install build deps (gcc for -race; driver is pure-Go glebarez, no system sqlite)
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Capability regression gate
        run: CGO_ENABLED=1 go test -race -count=1 ./internal/ctfplatform/ -run 'TestAllRegisteredSolversActuallyExecute|TestECDSANonceReuse|TestPaddingOracle|TestBlindOOB|TestForensicsNoFalsePositiveOnRandom|TestWebExploitNoFalsePositive|TestPresolveRegistrySweepNoDiagnosticFalsePositive' -timeout 300s

  # 证据 / 口径一致性门禁：双语言机验证据包 + 单一真值源健康度。
  # 防止「求解器注水 / 能力回退 / 口径塌缩」回归，每次 PR/push 自动拦。
  # 纯 Python（基准套件本体为标准库，仅 padding-oracle judge 需 pycryptodome）；
  # Go 侧权威机验由上方 capability-gate 覆盖，本 job 不重复跑 Go。
  evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark deps (pycryptodome for padding-oracle judge)
        run: python -m pip install --upgrade pip && pip install pycryptodome
      - name: Regenerate dual-language benchmark summary
        run: python data/ctf_benchmark/run_all_benchmarks.py
      - name: Evidence / caliber consistency gate
        run: python scripts/verify_evidence.py
