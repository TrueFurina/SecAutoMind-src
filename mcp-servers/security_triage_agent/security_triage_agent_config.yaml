# SecAutoMind 外部 MCP：security_triage_agent 配置
# ================================================
# 格式限制（如实声明）：仅支持顶层 `key: value` 扁平键值。
#   本项目核心运行零第三方依赖，故刻意不引入 PyYAML；不支持嵌套 / 列表 /
#   引号内的 `#`。需要复杂结构时请改用环境变量。
#
# 优先级：**环境变量 > 本文件 > 代码默认值**（已存在的环境变量不会被本文件覆盖）。
#   部署时可用 env 临时覆盖而不改文件。
#
# 数据目录不可配置：服务固定读写 `<本目录>/security_agent/data/`（含样例告警、
#   资产、情报与 ledger 台账）。若需接入自有告警库，请替换该目录下的 JSON 数据源。

# ── 主配置项：决定 MCP 暴露的工具面（真影响 tools/list）────────────────
# true  → 额外注册第 11 个工具 command_executor（命令执行）
# false → 只暴露 10 个只读/研判类工具（默认，安全优先）
#
# 风险提示：command_executor 会执行传入的命令文本。仅在隔离环境、且确认
#   调用方可信时开启；SecAutoMind 侧建议同时不要把它放进 HITL 免审批白名单。
command_tool_enabled: false

# ── 以下为 LLM 段（继承自主程序配置面，对本服务无行为影响）──────────────
# 事实说明：本服务暴露的 10 个工具均为**规则 / 检索实现**，不调用大模型。
#   因此以下配置**不会改变本 MCP 的任何工具行为**，保留它们仅为：
#   (1) 与主程序 AppConfig 配置面保持一致，便于后续扩展；
#   (2) 若将来有工具需要 LLM 能力，可直接复用而无需改配置契约。
# 如你的场景不需要，可整段保持默认。
use_real_llm: false          # 是否启用真实 LLM（对本服务工具无影响）
llm_provider: generic        # deepseek / qwen / generic
llm_base_url: ""             # 留空则按 provider 取默认端点
llm_api_key: ""              # 切勿把真实密钥提交进仓库；生产请用环境变量注入
llm_model: ""                # 留空则按 provider 取默认模型
llm_timeout_seconds: 45      # LLM 请求超时（秒）
