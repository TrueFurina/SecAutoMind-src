[project]
name = "ctf-agent"
version = "0.1.0"
description = "西湖论剑 AI-Agent 自动解 CTF 系统（1主1监架构，解出率优先）"
# 原写 ">=3.13"，但唯一实际跑题的环境是服务器 172.16.222.99 的 /usr/bin/python3
# = 3.12.13（2026-11-08 实测）；CI 也从未测过 3.12。声明高于生产 ⇒ 部署机按
# 声明判断会认为服务器「不合规」，而服务器正是跑出所有历史数字的那台。
# 放宽前先验证了 3.12 真实可用（不是猜）：
#   ① 语法：ctf_agent 全树 710 个 .py 用 3.12 ast.parse，709 通过，唯一失败是
#      赛题附件 data/questions_external/.../_attachments/chal.py（Python 2 脚本，
#      非项目代码）；
#   ② API：3.13 专属（typing.override / itertools.batched / copy.replace /
#      Path.full_match / typing.ReadOnly / typing.TypeIs / warnings.deprecated）
#      全仓零使用；
#   ③ 实跑：3.12.13 下默认门禁 2156 passed（那批代码落后 HEAD 37 个 commit，
#      见 docs/evidence/跑批副本落后37commit_与依赖缺失_20261108.md）。
# 下限如果将来被误用到 3.13 特性，CI 的 3.12 腿会红 —— 这是保留 3.12 腿的理由。
requires-python = ">=3.12"
dependencies = [
    # 核心异步/HTTP
    "aiohttp>=3.9",
    "httpx>=0.27",
    # Web dashboard
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # 密码学/数学
    "gmpy2>=2.1",
    "pycryptodome>=3.20",
    "sympy>=1.13",
    "numpy>=2.0",
    # 图像处理（misc 隐写/视觉）
    "pillow>=10.0",
    # 数据验证
    "pydantic>=2.0",
    # Pygments（代码高亮/日志）
    "Pygments>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    # tests/test_pcap_probe.py 有 6 个 async 用例。缺这个插件时它们不是 skip 而是
    # **FAILED**（"async def functions are not natively supported"），而 dev extra
    # 原本只列了 pytest + pytest-timeout ⇒ 按 pyproject 装依赖的人拿不到绿门禁。
    # 2026-11-08 服务器实证：装齐前 6 failed，装上后 35 passed。
    "pytest-asyncio>=0.23",
]
# 可选：本地 OCR（tesseract 需系统级安装，未装则视觉兜底走 LLM）
vision = [
    "pytesseract>=0.3.10",
    "pymupdf>=1.24",
]
# 可选：pcap 通道（tools/adapters/pcap_probe.py）。scapy 负责解析与 TCP 重组；
# brotli/zstandard 负责 Content-Encoding: br/zstd 的正文还原 —— 缺任一个都只降级
# 不崩，但现代站点的 flag 常压在 br 正文里，语义上应视为必备。
pcap = [
    "scapy>=2.5",
    "brotli>=1.1",
    "zstandard>=0.22",
]

[tool.setuptools]
packages = [
    "ctf_agent",
    "ctf_agent.llm",
    "ctf_agent.eval",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# ruff_gate（2026-10-12）：落地文档宣称但此前未接线的 lint 门禁。
# 仅拦截 F 类（pyflakes）中与"未定义/未使用符号"相关的 5 个 code，
# 与仓库既有的 # noqa: F401 实践一致；不引入 E/W 风格规则，避免误伤。
#
# 分级口径（2026-10-21 全仓首扫后定）：
#   全仓零容忍    F821（未定义名）/ F811（重定义）—— 这两类是**跑不起来或静默失效**的
#                真 bug。本轮全仓首扫即抓出 6 个：凯撒引擎 re 未导入（每次执行必 NameError，
#                被外层 try/except 吞成 return None → 引擎永久静默死亡）、pkcs1 分支
#                `int(x)` 的 x 从未定义、三个测试 __main__ 块调用改名后不存在的函数。
#   核心目录零容忍 F401 / F841 —— core/ agents/ tools/ llm/ eval/ scheduler/ ctfplatform/
#                skills/ 与根级 run.py、config.py。本轮已逐条清理 100 处
#                （49 处 F401 自动修 + 8 处 F841 逐条判读 + skills 36 处）。
#   tests/ scripts/ 豁免 F401/F841 —— 测试里的未使用导入多为 re-export 夹具，
#                scripts/_*.py 是一次性取证脚本；逐条修的风险高于收益。**豁免不等于通过**：
#                这两个目录仍在 F821/F811 覆盖范围内。
#   tools/tools/ 整目录排除 —— 历史遗留的重复副本（21 个文件），无人 import
#                （`import tools.registry` 解析到 tools/registry.py 真身），且副本内部
#                自己也是 `from tools.base import ...` 引用真身。待人工确认后清理，
#                本次只排除不删除。
[tool.ruff]
line-length = 100
extend-exclude = [
    "tools/tools",
    "_archive_defense",
    # 2026-11-04：题库入版本库后，ruff 会扫描**题目附件里的 .py**。
    # 那些是赛题给的素材（protobuf 生成代码、题目脚本、他人 exploit，
    # 甚至有故意写坏的语法），不是本项目源码——对它们做 lint 既无意义又恒红
    # （实测 msgs_pb2.py 报 _RSAENCRYPTIONDATA 未定义；chal.py 报 invalid-syntax）。
    # ⚠️ 用 glob 形式 `**/_attachments/**`：实测写具体前缀 `data/xxx/_attachments`
    # 时 ruff 不匹配（它按文件中转路径匹配），换成 `**/` 前缀后生效。
    "**/_attachments/**",
]

[tool.ruff.lint]
select = ["F401", "F811", "F821", "F822", "F841"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]
"scripts/*" = ["F401", "F841"]
"__init__.py" = ["F401"]  # 包 __init__ 的 re-export 是公开接口，不是噪音
